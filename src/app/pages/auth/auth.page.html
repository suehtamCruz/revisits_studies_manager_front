<main class="auth">
  <section class="card">
    <div class="card__logo">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
      </svg>
    </div>

    <h1 class="card__title">Meus Estudos</h1>
    <p class="card__subtitle">Organize seus estudos e revisitas</p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tabs__tab" [class.tabs__tab--active]="mode() === 'login'"
        [attr.aria-selected]="mode() === 'login'" (click)="setMode('login')">
        Entrar
      </button>
      <button type="button" role="tab" class="tabs__tab" [class.tabs__tab--active]="mode() === 'register'"
        [attr.aria-selected]="mode() === 'register'" (click)="setMode('register')">
        Cadastrar
      </button>
    </div>

    @if (mode() === 'login') {
    <form class="form" [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="field">
        <label class="field__label" for="login-email">E-mail</label>
        <input class="field__input" id="login-email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="field">
        <label class="field__label" for="login-password">Senha</label>
        <div class="field__password">
          <input class="field__input" id="login-password" [type]="showPassword() ? 'text' : 'password'"
            formControlName="password" autocomplete="current-password" />
          <button class="field__toggle" type="button" (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'">
            <span class="material-icons">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>
      @if (error()) {
      <p class="form__error">{{ error() }}</p>
      }
      <button class="submit" type="submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>
    } @else {
    <form class="form" [formGroup]="registerForm" (ngSubmit)="submit()">
      <div class="field">
        <label class="field__label" for="register-name">Nome</label>
        <input class="field__input" id="register-name" type="text" formControlName="name" autocomplete="name" />
      </div>
      <div class="field">
        <label class="field__label" for="register-email">E-mail</label>
        <input class="field__input" id="register-email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="field">
        <label class="field__label" for="register-password">Senha</label>
        <div class="field__password">
          <input class="field__input" id="register-password" [type]="showPassword() ? 'text' : 'password'"
            formControlName="password" autocomplete="new-password" />
          <button class="field__toggle" type="button" (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'">
            <span class="material-icons">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>
      @if (error()) {
      <p class="form__error">{{ error() }}</p>
      }
      <button class="submit" type="submit" [disabled]="registerForm.invalid">Criar conta</button>
    </form>
    }
  </section>
</main>
