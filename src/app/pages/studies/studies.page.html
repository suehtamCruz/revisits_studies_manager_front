<app-header />

<main class="page">
  <div class="page__top">
    <h1 class="page__title">Estudos</h1>
    <button class="new-btn" type="button" (click)="modalOpen.set(true)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span>Novo</span>
    </button>
  </div>

  @if (studies().length === 0) {
  <div class="empty">
    <p>Nenhum cadastro ainda.</p>
  </div>
  } @else {
  <ul class="list">
    @for (study of studies(); track $index) {
    <li class="list__item">
      <span class="list__name">{{ study.name }}</span>
      <span class="list__meta">{{ study.day }}</span>
    </li>
    }
  </ul>
  }
</main>

<app-person-form-modal [(open)]="modalOpen" title="Novo estudo" dayLabel="Dia do estudo"
  submitLabel="Salvar estudo" (saved)="onSaved($event)" />
